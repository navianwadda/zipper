name: Revert Fragments and Add SportsViewModel

on:
  workflow_dispatch:

jobs:
  push-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write files
        run: |
          mkdir -p app
          echo "" | base64 -d > app/build.gradle.kts

          mkdir -p app/src/main/java/com/livetvpro/app/ui/adapters
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/adapters/ComposeCards.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/appearance
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/appearance/AppearanceFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/categories
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/deviceid
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/deviceid/DeviceIdFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/favorites
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/favorites/FavoritesFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/home
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/home/HomeFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/live
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/live/LiveEventsFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/networkstream
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/networkstream/NetworkStreamFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/playlists
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/playlists/PlaylistsFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/score
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/score/CricketScoreFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/score
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/score/FootballScoreFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/settings
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/settings/SettingsFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/sports
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/sports/SportsFragment.kt

          mkdir -p app/src/main/java/com/livetvpro/app/ui/sports
          echo "" | base64 -d > app/src/main/java/com/livetvpro/app/ui/sports/SportsViewModel.kt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/livetvpro/app/ui/adapters/ComposeCards.kt \
            app/src/main/java/com/livetvpro/app/ui/appearance/AppearanceFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/deviceid/DeviceIdFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/favorites/FavoritesFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/home/HomeFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/live/LiveEventsFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/networkstream/NetworkStreamFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/playlists/PlaylistsFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/score/CricketScoreFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/score/FootballScoreFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/settings/SettingsFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/sports/SportsFragment.kt \
            app/src/main/java/com/livetvpro/app/ui/sports/SportsViewModel.kt
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Revert all fragments to XML version, fix ComposeCards glide, add SportsViewModel"
          git push
