name: Apply Navigation Animations

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write files
        run: |
          mkdir -p app/src/main/res/anim
          mkdir -p app/src/main/res/navigation
          mkdir -p app/src/main/java/com/livetvpro/app
          echo '' | base64 -d > app/src/main/res/anim/slide_in_right.xml
          echo '' | base64 -d > app/src/main/res/anim/slide_out_left.xml
          echo '' | base64 -d > app/src/main/res/anim/slide_in_left.xml
          echo '' | base64 -d > app/src/main/res/anim/slide_out_right.xml
          echo '' | base64 -d > app/src/main/res/anim/fade_in.xml
          echo '' | base64 -d > app/src/main/res/anim/fade_out.xml
          echo '' | base64 -d > app/src/main/res/navigation/nav_graph.xml
          echo '' | base64 -d > app/src/main/java/com/livetvpro/app/MainActivity.kt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
                  app/src/main/res/anim/slide_in_right.xml \
                  app/src/main/res/anim/slide_out_left.xml \
                  app/src/main/res/anim/slide_in_left.xml \
                  app/src/main/res/anim/slide_out_right.xml \
                  app/src/main/res/anim/fade_in.xml \
                  app/src/main/res/anim/fade_out.xml \
                  app/src/main/res/navigation/nav_graph.xml \
                  app/src/main/java/com/livetvpro/app/MainActivity.kt
          git diff --cached --quiet || git commit -m "Add navigation animations"
          git push
