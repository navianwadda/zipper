name: push-appearance-feature

on:
  workflow_dispatch:

jobs:
  push-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Push Appearance feature files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          push_file() {
            local FILE_PATH="$1"
            local CONTENT="$2"
            local SHA
            SHA=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/contents/$FILE_PATH?ref=$BRANCH" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('sha',''))" 2>/dev/null || true)
            if [ -n "$SHA" ]; then
              PAYLOAD=$(printf '{"message":"feat: appearance — %s","content":"%s","sha":"%s","branch":"%s"}' \
                "$FILE_PATH" "$CONTENT" "$SHA" "$BRANCH")
            else
              PAYLOAD=$(printf '{"message":"feat: appearance — %s","content":"%s","branch":"%s"}' \
                "$FILE_PATH" "$CONTENT" "$BRANCH")
            fi
            curl -sf -X PUT \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/contents/$FILE_PATH" > /dev/null
            echo "✓ $FILE_PATH"
          }

          push_file "app/src/main/res/layout/fragment_appearance.xml" \
            ""

          push_file "app/src/main/res/layout/fragment_settings.xml" \
            ""

          push_file "app/src/main/res/layout/item_theme_preview.xml" \
            ""

          push_file "app/src/main/res/navigation/nav_graph.xml" \
            ""

          push_file "app/src/main/res/values/styles.xml" \
            ""

          push_file "app/src/main/res/drawable/segmented_button_bg.xml" \
            ""

          push_file "app/src/main/res/drawable/segmented_item_bg.xml" \
            ""

          push_file "app/src/main/res/drawable/preview_bar_shape.xml" \
            "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCIKICAgIGFuZHJvaWQ6c2hhcGU9InJlY3RhbmdsZSI+CiAgICA8Y29ybmVycyBhbmRyb2lkOnJhZGl1cz0iNGRwIi8+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iI0ZGRkZGRkZGIi8+Cjwvc2hhcGU+Cg=="

