name: Apply App Icon Fix

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to commit the changes to"
        required: false
        default: ""
      commit_message:
        description: "Commit message"
        required: false
        default: "Apply app icon fix: sync launcher icon selection across app"

permissions:
  contents: write

jobs:
  apply-icon-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}

      - name: Verify expected files exist before overwriting (safety check)
        run: |
          set -e
          for f in \
            "app/src/main/java/com/livetvpro/app/utils/AppIconUtils.kt" \
            "app/src/main/java/com/livetvpro/app/data/local/ThemeManager.kt" \
            "app/src/main/java/com/livetvpro/app/ui/appearance/AppearanceScreen.kt" \
            "app/src/main/java/com/livetvpro/app/ui/SplashActivity.kt" \
            "app/src/main/java/com/livetvpro/app/ui/home/HomeScreen.kt" \
            "app/src/main/java/com/livetvpro/app/ui/live/LiveEventsScreen.kt" \
            "app/src/main/java/com/livetvpro/app/ui/favorites/FavoritesScreen.kt" \
            "app/src/main/java/com/livetvpro/app/ui/sports/SportsScreen.kt" \
            "app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsScreen.kt" \
            "app/src/main/java/com/livetvpro/app/ui/player/compose/PlayerScreen.kt" \
            "app/src/main/java/com/livetvpro/app/ui/player/compose/ChannelListPanel.kt" \
          ; do
            if [ ! -f "$f" ]; then
              echo "::warning::$f does not exist yet in the repo — it will be created."
            fi
          done

      - name: Write AppIconUtils.kt
        run: |
          mkdir -p "app/src/main/java/com/livetvpro/app/utils"
          base64 -d <<'B64_EOF' > "app/src/main/java/com/livetvpro/app/utils/AppIconUtils.kt"
          cGFja2FnZSBjb20ubGl2ZXR2cHJvLmFwcC51dGlscwoKaW1wb3J0IGFuZHJvaWQuY29udGVudC5D
          b250ZXh0CmltcG9ydCBjb20ubGl2ZXR2cHJvLmFwcC5SCgpvYmplY3QgQXBwSWNvblV0aWxzIHsK
          CiAgICBwcml2YXRlIGNvbnN0IHZhbCBQUkVGU19OQU1FID0gImxpdmVfdHZfcHJvX3ByZWZzIgog
          ICAgcHJpdmF0ZSBjb25zdCB2YWwgS0VZX0FQUF9JQ09OX0JMQUNLID0gImFwcF9pY29uX2JsYWNr
