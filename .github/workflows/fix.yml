name: Apply Theme Fix v2

on:
  workflow_dispatch:

jobs:
  push-theme-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Push MainActivity.kt
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const content = "";
            const path = "app/src/main/java/com/livetvpro/app/MainActivity.kt";
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main"
              });
              sha = existing.data.sha;
            } catch (e) {
              sha = undefined;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "chore: apply theme_fix_v2 - MainActivity.kt",
              content,
              sha,
              branch: "main"
            });

