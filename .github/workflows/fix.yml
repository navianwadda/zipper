name: Patch Bottom Nav

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write drawable files
        run: |
          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCIKICAgIGFuZHJvaWQ6c2hhcGU9InJlY3RhbmdsZSI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iIzI2RUY0NDQ0IiAvPgogICAgPGNvcm5lcnMgYW5kcm9pZDpyYWRpdXM9IjUwZHAiLz4KPC9zaGFwZT4K" \
            | base64 -d > app/src/main/res/drawable/bottom_nav_container_bg.xml

          echo "PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHNoYXBlIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCIKICAgIGFuZHJvaWQ6c2hhcGU9InJlY3RhbmdsZSI+CiAgICA8c29saWQgYW5kcm9pZDpjb2xvcj0iIzI2RUY0NDQ0IiAvPgogICAgPGNvcm5lcnMgYW5kcm9pZDpyYWRpdXM9IjI4ZHAiLz4KPC9zaGFwZT4K" \
            | base64 -d > app/src/main/res/drawable/bottom_nav_glass_background.xml

          echo "" \
            | base64 -d > app/src/main/res/drawable/bottom_nav_text_colors.xml

      - name: Write color file
        run: |
          echo "" \
            | base64 -d > app/src/main/res/color/bottom_nav_colors.xml

      - name: Write layout file
        run: |
          echo "" \
            | base64 -d > app/src/main/res/layout/activity_main.xml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/res/drawable/bottom_nav_container_bg.xml \
            app/src/main/res/drawable/bottom_nav_glass_background.xml \
            app/src/main/res/drawable/bottom_nav_text_colors.xml \
            app/src/main/res/color/bottom_nav_colors.xml \
            app/src/main/res/layout/activity_main.xml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "style: transparent red bottom nav"
          git push
