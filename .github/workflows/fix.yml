      - name: Push PlayerActivity.kt
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('/tmp/large_file.b64', 'utf8').trim();
            const path = "app/src/main/java/com/livetvpro/app/ui/player/PlayerActivity.kt";
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main"
              });
              sha = existing.data.sha;
            } catch (e) { sha = undefined; }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "chore: apply theme_fix_v2 - PlayerActivity.kt",
              content,
              sha,
              branch: "main"
            });
