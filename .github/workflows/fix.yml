name: Apply Fixes

on:
  workflow_dispatch:

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write DeviceUtils.kt
        run: |
          mkdir -p $(dirname "app/src/main/java/com/livetvpro/app/utils/DeviceUtils.kt")
          echo '' | base64 -d > "app/src/main/java/com/livetvpro/app/utils/DeviceUtils.kt"

      - name: Write PlayerActivity.kt
        run: |
          mkdir -p $(dirname "app/src/main/java/com/livetvpro/app/ui/player/PlayerActivity.kt")
          echo '' | base64 -d > "app/src/main/java/com/livetvpro/app/ui/player/PlayerActivity.kt"

      - name: Write FloatingPlayerActivity.kt
        run: |
          mkdir -p $(dirname "app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerActivity.kt")
          echo '' | base64 -d > "app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerActivity.kt"

      - name: Write FloatingPlayerService.kt
        run: |
          mkdir -p $(dirname "app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerService.kt")
          echo '' | base64 -d > "app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerService.kt"

      - name: Write FloatingPlayerHelper.kt
        run: |
          mkdir -p $(dirname "app/src/main/java/com/livetvpro/app/utils/FloatingPlayerHelper.kt")
          echo '' | base64 -d > "app/src/main/java/com/livetvpro/app/utils/FloatingPlayerHelper.kt"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "app/src/main/java/com/livetvpro/app/utils/DeviceUtils.kt"
          git add "app/src/main/java/com/livetvpro/app/ui/player/PlayerActivity.kt"
          git add "app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerActivity.kt"
          git add "app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerService.kt"
          git add "app/src/main/java/com/livetvpro/app/utils/FloatingPlayerHelper.kt"
          git diff --cached --stat
          git commit -m "fix: device detection, ClearKey DRM JWK, pipe-URL DRM, header forwarding" || echo "Nothing to commit"
          git push
