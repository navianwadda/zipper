name: Remove Dead Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-dead-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete dead files
        run: |
          FILES=(
            "app/src/main/java/com/livetvpro/app/ui/adapters/CategoryAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/CategoryGroupChipAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/CategoryGroupDialogAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/ChannelAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/EventCategoryAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/FavoriteAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/LinkChipAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/LiveEventAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/PlaylistAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/adapters/RelatedChannelAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/player/settings/TrackAdapter.kt"
            "app/src/main/java/com/livetvpro/app/ui/player/BasePlayerActivity.kt"
            "app/src/main/java/com/livetvpro/app/utils/NetworkUtils.kt"
            "app/src/main/java/com/livetvpro/app/utils/FileLogger.kt"
            "app/src/main/java/com/livetvpro/app/utils/OrientationHelper.kt"
            "app/src/main/java/com/livetvpro/app/utils/PlayerOrientation.kt"
            "app/src/main/java/com/livetvpro/app/utils/Constants.kt"
            "app/src/main/res/layout/item_category.xml"
            "app/src/main/res/layout/item_channel.xml"
            "app/src/main/res/layout/item_event_category.xml"
            "app/src/main/res/layout/item_favorite.xml"
            "app/src/main/res/layout/item_live_event.xml"
            "app/src/main/res/layout/item_related_channel.xml"
            "app/src/main/res/layout/item_related_event.xml"
            "app/src/main/res/layout/item_track_option.xml"
            "app/src/main/res/layout/item_category_group_chip.xml"
            "app/src/main/res/layout/item_category_group_dialog.xml"
            "app/src/main/res/layout/item_link_chip.xml"
            "app/src/main/res/layout/item_playlist.xml"
            "app/src/main/res/layout/activity_player.xml"
            "app/src/main/res/layout-television/activity_player.xml"
            "app/src/main/res/layout/activity_splash.xml"
            "app/src/main/res/layout/fragment_appearance.xml"
            "app/src/main/res/layout/fragment_category_channels.xml"
            "app/src/main/res/layout/fragment_device_id.xml"
            "app/src/main/res/layout/fragment_favorites.xml"
            "app/src/main/res/layout/fragment_home.xml"
            "app/src/main/res/layout/fragment_live_events.xml"
            "app/src/main/res/layout/fragment_network_stream.xml"
            "app/src/main/res/layout/fragment_playlists.xml"
            "app/src/main/res/layout/fragment_score_webview.xml"
            "app/src/main/res/layout/fragment_settings.xml"
            "app/src/main/res/layout/fragment_sports.xml"
            "app/src/main/res/layout/fragment_track_list.xml"
            "app/src/main/res/layout/dialog_add_playlist.xml"
            "app/src/main/res/layout/dialog_category_groups.xml"
            "app/src/main/res/layout/dialog_edit_playlist.xml"
            "app/src/main/res/layout/dialog_floating_player_settings.xml"
            "app/src/main/res/layout/dialog_list_item.xml"
            "app/src/main/res/layout/dialog_player_settings.xml"
            "app/src/main/res/layout/dialog_save_states.xml"
            "app/src/main/res/layout/item_dropdown_menu.xml"
            "app/src/main/res/layout/item_link_option.xml"
            "app/src/main/res/layout/item_related_channel_modern.xml"
            "app/src/main/res/layout/item_setting_option.xml"
            "app/src/main/res/layout/item_sport.xml"
            "app/src/main/res/layout/nav_header.xml"
            "app/src/main/res/layout/theme_toggle_footer.xml"
          )

          DELETED=0
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              git rm -q "$f"
              DELETED=$((DELETED+1))
            fi
          done
          echo "DELETED_COUNT=$DELETED" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to delete, all files already removed."
            exit 0
          fi
          git commit -m "chore: remove ${DELETED_COUNT} dead files"
          git push
