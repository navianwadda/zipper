name: Update Files from zipper branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write updated files
        run: |
          mkdir -p app/src/main/java/com/livetvpro/app/ui/components
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/components/MarqueeModifier.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/components
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/components/MarqueeMessageBanner.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/categories
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/home
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/home/HomeScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/main
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/main/MainScaffold.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/live
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/live/LiveEventsScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/favorites
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/favorites/FavoritesScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/sports
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/sports/SportsScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player/compose
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/player/compose/PlayerScreen.kt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/livetvpro/app/ui/components/MarqueeModifier.kt \
            app/src/main/java/com/livetvpro/app/ui/components/MarqueeMessageBanner.kt \
            app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsScreen.kt \
            app/src/main/java/com/livetvpro/app/ui/home/HomeScreen.kt \
            app/src/main/java/com/livetvpro/app/ui/main/MainScaffold.kt \
            app/src/main/java/com/livetvpro/app/ui/live/LiveEventsScreen.kt \
            app/src/main/java/com/livetvpro/app/ui/favorites/FavoritesScreen.kt \
            app/src/main/java/com/livetvpro/app/ui/sports/SportsScreen.kt \
            app/src/main/java/com/livetvpro/app/ui/player/compose/PlayerScreen.kt
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync 9 updated files"
          git push
