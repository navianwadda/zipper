name: Update Files from zipper branch

on:
  workflow_dispatch:

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write updated files
        run: |
          mkdir -p app
          printf '' | base64 -d > app/build.gradle.kts
          mkdir -p app/src/main/java/com/livetvpro/app/data/local
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/data/local/AppDatabase.kt
          mkdir -p app/src/main/java/com/livetvpro/app/data/local/dao
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/data/local/dao/ChannelDao.kt
          mkdir -p app/src/main/java/com/livetvpro/app/data/local/entity
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/data/local/entity/FavoriteChannelEntity.kt
          mkdir -p app/src/main/java/com/livetvpro/app/data/repository
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/data/repository/ChannelRepository.kt
          mkdir -p app/src/main/java/com/livetvpro/app/data/repository
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/data/repository/FavoritesRepository.kt
          mkdir -p app/src/main/java/com/livetvpro/app/di
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/di/DatabaseModule.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/categories
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/categories
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsViewModel.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/favorites
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/favorites/FavoritesViewModel.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerActivity.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/player/PlayerActivity.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/player/PlayerViewModel.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/sports
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/sports/SportsScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/sports
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/ui/sports/SportsViewModel.kt
          mkdir -p app/src/main/java/com/livetvpro/app/utils
          printf '' | base64 -d > app/src/main/java/com/livetvpro/app/utils/M3uParser.kt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            app/src/main/java/com/livetvpro/app/data/local/AppDatabase.kt \
            app/src/main/java/com/livetvpro/app/data/local/dao/ChannelDao.kt \
            app/src/main/java/com/livetvpro/app/data/local/entity/FavoriteChannelEntity.kt \
            app/src/main/java/com/livetvpro/app/data/repository/ChannelRepository.kt \
            app/src/main/java/com/livetvpro/app/data/repository/FavoritesRepository.kt \
            app/src/main/java/com/livetvpro/app/di/DatabaseModule.kt \
            app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsScreen.kt \
            app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsViewModel.kt \
            app/src/main/java/com/livetvpro/app/ui/favorites/FavoritesViewModel.kt \
            app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerActivity.kt \
            app/src/main/java/com/livetvpro/app/ui/player/PlayerActivity.kt \
            app/src/main/java/com/livetvpro/app/ui/player/PlayerViewModel.kt \
            app/src/main/java/com/livetvpro/app/ui/sports/SportsScreen.kt \
            app/src/main/java/com/livetvpro/app/ui/sports/SportsViewModel.kt \
            app/src/main/java/com/livetvpro/app/utils/M3uParser.kt
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync 16 updated files (comments removed)"
          git push
