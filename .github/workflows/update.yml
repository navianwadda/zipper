name: Apply Crash and Build Fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write updated files
        run: |
          mkdir -p app/src/main/java/com/livetvpro/app
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/LiveTVProApplication.kt
          mkdir -p app/src/main/java/com/livetvpro/app/cast
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/cast/CastManager.kt
          mkdir -p app/src/main/java/com/livetvpro/app/utils
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/utils/AppIconUtils.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/player/PlayerTuning.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/player/PlayerActivity.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerActivity.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/player/FloatingPlayerService.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/categories
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/categories/CategoryChannelsScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/favorites
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/favorites/FavoritesScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/home
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/home/HomeScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/live
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/live/LiveEventsScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/player/compose
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/player/compose/PlayerScreen.kt
          mkdir -p app/src/main/java/com/livetvpro/app/ui/sports
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/ui/sports/SportsScreen.kt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || (git commit -m "Fix Cast startup ANR, low-RAM player buffer, Glide placeholder build error, black icon crash on API < 26" && git push)
