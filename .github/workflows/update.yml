name: Update Libraries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write updated files
        run: |
          printf '' | base64 -d | gunzip > build.gradle.kts
          mkdir -p app
          printf '' | base64 -d | gunzip > app/build.gradle.kts
          mkdir -p app/src/main/java/com/livetvpro/app/data/repository
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/data/repository/NativeDataRepository.kt
          mkdir -p app/src/main/java/com/livetvpro/app/utils
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/utils/RedirectCooldownManager.kt
          mkdir -p app/src/main/java/com/livetvpro/app/utils
          printf '' | base64 -d | gunzip > app/src/main/java/com/livetvpro/app/utils/NativeListenerManager.kt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes" || (git commit -m "Update libraries: Kotlin 2.2.21, Compose BOM 2026.11.01, Firebase BoM 35.2.0, AndroidX" && git push)
